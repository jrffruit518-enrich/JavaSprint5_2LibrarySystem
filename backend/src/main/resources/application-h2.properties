# --- H2 Database Configuration (In-Memory) ---
# English Comment: Use MySQL compatibility mode for H2 to ensure SQL consistency
spring.datasource.url=jdbc:h2:mem:library_fallback;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA/Hibernate for H2 ---
# English Comment: Always use 'create' for memory DB to build tables on startup
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- MongoDB Configuration (Secondary) ---
# English Comment: Ensure local Mongo is running for log persistence
spring.data.mongodb.uri=mongodb://localhost:27017/library_test
spring.data.mongodb.connect-timeout=3000

# --- Jackson / Timezone (Europe/Madrid) ---
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Europe/Madrid