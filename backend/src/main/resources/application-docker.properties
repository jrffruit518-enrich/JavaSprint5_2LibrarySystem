# MySQL in Docker
spring.datasource.url=jdbc:mysql://mysql-container:3306/librarydb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root_password

# MongoDB in Docker
spring.data.mongodb.uri=mongodb://mongo-container:27017/library_logs

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false